name: Create Release Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-and-tag:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read current version
        id: read-version
        run: |
          VERSION_LINE=$(grep -E 'const Version = ' internal/cli/version.go)
          CURRENT_VERSION=$(echo "$VERSION_LINE" | cut -d'"' -f2)
          echo "Current version is $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump-version
        run: |
          CURRENT_VERSION="${{ steps.read-version.outputs.version }}"
          VERSION_CLEAN="${CURRENT_VERSION#v}"
          
          IFS='.' read -r major minor patch <<< "$VERSION_CLEAN"
          NEW_PATCH=$((patch + 1))
          NEW_VERSION="v$major.$minor.$NEW_PATCH"
          echo "New version will be $NEW_VERSION"
          
          sed -i "s/const Version = \".*\"/const Version = \"$NEW_VERSION\"/g" internal/cli/version.go
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        run: |
          NEW_VERSION="${{ steps.bump-version.outputs.new_version }}"
          git add internal/cli/version.go
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push origin main

      - name: Create and push tag
        run: |
          NEW_VERSION="${{ steps.bump-version.outputs.new_version }}"
          git tag "$NEW_VERSION"
          git push origin "$NEW_VERSION"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> 2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}